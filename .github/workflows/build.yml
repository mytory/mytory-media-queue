name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            artifact: macos-universal
            bundles: dmg
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: ""
            artifact: windows-x86_64
            bundles: nsis,msi
            bundle_dir: src-tauri/target/release/bundle
          - platform: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            tauri_args: ""
            artifact: linux-x86_64
            bundles: deb,appimage
            bundle_dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch bundled media toolchain
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            macos-*) bash scripts/fetch-tools.sh universal-apple-darwin ;;
            *) bash scripts/fetch-tools.sh "${{ matrix.rust_targets }}" ;;
          esac

      - name: Install npm dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.tauri_args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.bundle_dir }}/**/*.app
            ${{ matrix.bundle_dir }}/**/*.dmg
            ${{ matrix.bundle_dir }}/**/*.exe
            ${{ matrix.bundle_dir }}/**/*.msi
            ${{ matrix.bundle_dir }}/**/*.AppImage
            ${{ matrix.bundle_dir }}/**/*.deb
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.bundle_dir }}/**/*.app
            ${{ matrix.bundle_dir }}/**/*.dmg
            ${{ matrix.bundle_dir }}/**/*.exe
            ${{ matrix.bundle_dir }}/**/*.msi
            ${{ matrix.bundle_dir }}/**/*.AppImage
            ${{ matrix.bundle_dir }}/**/*.deb
