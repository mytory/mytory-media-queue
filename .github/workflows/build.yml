name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            artifact: macos-universal
            bundles: dmg
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
            bundle_files: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: ""
            artifact: windows-x86_64
            bundles: nsis,msi
            bundle_dir: src-tauri/target/release/bundle
            bundle_files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            tauri_args: ""
            artifact: linux-x86_64
            bundles: deb,appimage
            bundle_dir: src-tauri/target/release/bundle
            bundle_files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Windows FFmpeg build dependencies
        if: matrix.platform == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            curl
            diffutils
            perl
            unzip
            xz

      - name: Fetch verified bundled tools on Windows
        if: matrix.platform == 'windows-latest'
        shell: msys2 {0}
        run: bash scripts/fetch-tools.sh "${{ matrix.rust_targets }}"

      - name: Fetch verified bundled tools on macOS or Linux
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            macos-*) bash scripts/fetch-tools.sh universal-apple-darwin ;;
            *) bash scripts/fetch-tools.sh "${{ matrix.rust_targets }}" ;;
          esac

      - name: Install npm dependencies
        run: npm ci

      - name: Build Linux installer with verbose bundler logs
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri build -- --verbose --bundles ${{ matrix.bundles }} ${{ matrix.tauri_args }}

      - name: Build macOS or Windows installer
        if: matrix.platform != 'ubuntu-22.04'
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.tauri_args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_files }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.bundle_files }}

      - name: Attach FFmpeg corresponding source to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/binaries/ffmpeg-source/ffmpeg-7.1.1.tar.xz
